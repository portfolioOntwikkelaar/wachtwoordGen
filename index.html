<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wachtwoord Generator ⚙️</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="generator-container">
      <h1 class="title">Wachtwoord Generator</h1>

      <div class="result-box">
        <span id="result">Klik op “Genereer”</span>
        <button id="clipboard" class="icon-btn" title="Kopieer">
          <i class="far fa-clipboard"></i>
        </button>
      </div>

      <div class="settings">
        <div class="setting">
          <label>Lengte</label>
          <input type="number" id="length" min="4" max="40" value="16" />
        </div>
        <div class="setting"><label>Kleine letters</label><input type="checkbox" id="lowercase" checked /></div>
        <div class="setting"><label>Hoofdletters</label><input type="checkbox" id="uppercase" checked /></div>
        <div class="setting"><label>Cijfers</label><input type="checkbox" id="numbers" checked /></div>
        <div class="setting"><label>Symbolen</label><input type="checkbox" id="symbols" checked /></div>
      </div>

      <div class="strength">
        Sterkte: <span id="strength-text">–</span>
        <div class="bar"><div id="strength-bar"></div></div>
      </div>

      <button id="generate" class="btn-generate">Genereer wachtwoord</button>

      <div id="toast" class="toast">📋 Gekopieerd naar klembord!</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
